<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Письмо из замка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Marck+Script&display=swap">
<style>
:root{--acc:#d4a72c;--ink:#f3e8c8;--serif:"Cormorant Garamond",Georgia,serif;--hand:"Marck Script","Brush Script MT",cursive;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#05050f;color:var(--ink);font-family:var(--serif);font-size:1.1rem;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#bg{position:fixed;inset:0;z-index:0}
.sc{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;overflow:hidden}
.sc.on{opacity:1}
.sc svg{position:absolute;inset:0;width:100%;height:100%}
#s_night{background:linear-gradient(#04061a,#161640 60%,#3a2a58)}
#s_hall{background:linear-gradient(#0a0b22,#1b1530 55%,#2b1a18)}
#s_class{background:linear-gradient(#1d1410,#3a2716)}
#s_dungeon{background:linear-gradient(#050d0b,#0c2a23)}
#s_pitch{background:linear-gradient(#2b2158 0%,#9b4f7a 34%,#f59a63 50%,#ffd89a 58%)}
#s_forest{background:linear-gradient(#020510,#07142b 60%,#0c2236)}
#s_library{background:linear-gradient(#1a0f08,#2c1b0e)}
#s_common{background:linear-gradient(#140805,#2a120a)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(95% 75% at 50% 45%,transparent 45%,rgba(0,0,0,.55))}
.st{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 150px 20px,#ffe9a8,transparent),radial-gradient(1px 1px at 60px 140px,#fff,transparent);background-size:180px 170px;animation:tw 4s ease-in-out infinite alternate}
.st.b{background-size:230px 210px;animation-delay:-2s;opacity:.7}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.wn{animation:wf 4s infinite}@keyframes wf{0%,100%{opacity:.9}45%{opacity:.35}50%{opacity:1}}
.owlfly{position:absolute;top:22%;left:-10%;font-size:1.6rem;filter:brightness(0) opacity(.8);animation:ow 22s linear infinite}
@keyframes ow{to{left:110%;transform:translateY(-70px)}}
.mist,.mist2{position:absolute;left:-20%;right:-20%;bottom:6%;height:22%;background:radial-gradient(50% 50% at 50% 50%,rgba(190,200,230,.16),transparent);animation:dr 24s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(12%)}}
.cn{position:absolute;width:6px;height:22px;background:#efe3c0;border-radius:2px;animation:bob 5s ease-in-out infinite}
.cn::before{content:"";position:absolute;left:50%;top:-11px;width:8px;height:12px;margin-left:-4px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(#fff3b0,#ff9d2e 70%,transparent);box-shadow:0 0 12px 3px rgba(255,170,60,.55);animation:fl .3s infinite alternate}
@keyframes bob{50%{transform:translateY(-9px)}}@keyframes fl{to{transform:scale(1.15,.9)}}
.dm{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6b0;opacity:.5;animation:dm 10s linear infinite}
@keyframes dm{from{transform:translateY(0)}to{transform:translateY(-130px);opacity:0}}
.bb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(120,255,190,.35));animation:rise 5s ease-in infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-160px);opacity:0}}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#e9ff9a;box-shadow:0 0 10px 3px rgba(233,255,154,.6);animation:ff 7s ease-in-out infinite alternate}
@keyframes ff{50%{opacity:.2}to{transform:translate(var(--dx),var(--dy))}}
.cl{position:absolute;height:50px;border-radius:50%;background:rgba(255,200,190,.35);filter:blur(14px);animation:cl 60s linear infinite}
@keyframes cl{from{transform:translateX(-120%)}to{transform:translateX(520%)}}
.fw{animation:fw 2s ease-in-out infinite alternate;transform-origin:33px 124px}@keyframes fw{to{transform:skewY(7deg)}}
.win{position:absolute;top:7%;left:50%;transform:translateX(-50%);width:min(56vw,230px);height:min(30vh,240px);border-radius:120px 120px 6px 6px;border:8px solid #3a2616;background:linear-gradient(#0b1430,#1c2a55);overflow:hidden}
.win::before,.win::after{content:"";position:absolute;background:#3a2616}.win::before{left:50%;top:0;bottom:0;width:4px}.win::after{top:50%;left:0;right:0;height:4px}
.sf{position:absolute;top:-6px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;animation:sn 7s linear infinite}
@keyframes sn{to{transform:translate(18px,260px)}}
.fire{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);width:min(70vw,290px);height:200px;border:14px solid #3b2a22;border-bottom:0;border-radius:130px 130px 0 0;background:#0e0604;overflow:hidden}
.fg{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 100%,rgba(255,150,50,.75),transparent);animation:fg .35s infinite alternate}
@keyframes fg{to{opacity:.7;transform:scale(1.04)}}
.fd{position:absolute;bottom:0;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:linear-gradient(#ffd45a,#ff6a1a 70%,transparent);animation:fdl .5s infinite alternate}
@keyframes fdl{from{transform:scaleY(.85) skewX(-4deg)}to{transform:scaleY(1.08) skewX(5deg)}}
.glowroom{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 85%,rgba(255,130,50,.22),transparent);animation:fg .6s infinite alternate}
#hud{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px;pointer-events:none;font-weight:700;letter-spacing:.05em}
#hud>*{pointer-events:auto;background:rgba(10,8,24,.62);border:1px solid #6e5a2a;border-radius:20px;padding:5px 12px;font-size:.95rem;color:var(--ink)}
#mute{cursor:pointer;font-family:inherit}
#app{position:relative;z-index:3;height:100%;box-sizing:border-box;padding-top:52px;display:flex;flex-direction:column}
.card,.cap{box-sizing:border-box;background:rgba(14,10,28,.8);border:1px solid var(--acc);border-radius:14px;backdrop-filter:blur(3px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 0 40px -10px var(--acc);transition:border-color 1s,box-shadow 1s}
.card{margin:auto;width:calc(100% - 28px);max-width:420px;max-height:calc(100% - 16px);overflow:auto;padding:22px 18px;animation:pop .5s}
.cap{margin:0 12px 12px;padding:12px 16px;align-self:center;width:calc(100% - 24px);max-width:440px;gap:8px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1,h2{margin:0;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-wrap:balance}
h1{font-size:1.8rem;line-height:1.1;color:var(--acc)}h2{font-size:1.15rem;color:var(--acc)}
p{margin:0;line-height:1.45}.hand{font-family:var(--hand);font-size:1.18rem;line-height:1.45}.dim{font-size:.88rem;opacity:.7}
button,a.btn{font-family:var(--serif);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:#2a1d08;background:linear-gradient(#e8c970,#a8832d);border:1px solid #6e5216;border-radius:4px;padding:10px 18px;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 #6e5216}
button:active{transform:translateY(1px)}button:disabled{opacity:.45}
button:focus-visible,a.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
button.ghost{background:transparent;box-shadow:none;color:var(--ink);border-color:#8a6a2f}
.opt{width:100%;text-transform:none;font-size:1.02rem;letter-spacing:0;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
#sq,#rq{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.owl{font-size:3.4rem;animation:fly 3s ease-in-out infinite}@keyframes fly{50%{transform:translate(8px,-10px) rotate(4deg)}}
.seal{width:62px;height:62px;border-radius:50%;padding:0;border:0;color:#f1b3a6;font-size:1.7rem;background:radial-gradient(circle at 35% 30%,#d33a3a,#7a0c0c);box-shadow:0 3px 8px rgba(0,0,0,.5);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 24px 5px rgba(210,60,60,.6)}}
.play{flex:1;min-height:0;position:relative;touch-action:none;overflow:hidden}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feather{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:3.2rem;transition:bottom 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 14px #ffe9a0)}
.feather span{display:inline-block;animation:wob 2.4s ease-in-out infinite}@keyframes wob{50%{transform:rotate(14deg) translateY(-6px)}}
.shelf{position:absolute;top:3%;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 8px}
.ing{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 8px;text-transform:none;letter-spacing:0;background:rgba(40,28,14,.85);color:var(--ink);border:1px solid #8a6a2f;box-shadow:none;font-size:.8rem}
.ing span{font-size:1.5rem}
.cauldron{position:absolute;left:50%;bottom:14%;width:160px;height:118px;transform:translateX(-50%);background:radial-gradient(circle at 35% 25%,#3a3f48,#0b0d11 70%);border-radius:30px 30px 80px 80px/20px 20px 90px 90px}
.cauldron::before{content:"";position:absolute;left:-8px;right:-8px;top:-12px;height:30px;border-radius:50%;background:#14171c;border:3px solid #2b3038}
.cauldron::after{content:"";position:absolute;left:8%;right:8%;bottom:-20px;height:28px;border-radius:50%;background:radial-gradient(#ff9a3a,transparent 70%);animation:fg .4s infinite alternate}
.liq{position:absolute;left:4px;right:4px;top:-8px;height:22px;border-radius:50%;background:var(--lc,#2d5b48);box-shadow:0 0 26px var(--lc,#2d5b48);transition:background .8s,box-shadow .8s;z-index:1}
.pbar{position:absolute;left:20%;right:20%;bottom:5%;height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;transition:opacity .6s}
.pbar i{display:block;height:100%;width:0;background:var(--acc)}
.snitch,.bl{position:absolute;width:30px;height:30px;border-radius:50%;transition:left .55s ease-in-out,top .55s ease-in-out}
.snitch{background:radial-gradient(circle at 35% 30%,#fff3b0,#d4a72c 60%,#8a6a10);box-shadow:0 0 16px #f5d36a;padding:0;border:0}
.snitch::before,.snitch::after{content:"";position:absolute;top:8px;width:24px;height:8px;border-radius:50%;background:rgba(255,255,255,.85);animation:fp .12s infinite alternate}
.snitch::before{right:26px}.snitch::after{left:26px}@keyframes fp{to{transform:scaleY(.3)}}
.snitch::marker{content:""}
.bl{background:radial-gradient(circle at 35% 30%,#555,#111);box-shadow:0 0 8px #000}
.hit{position:absolute;inset:-14px}
.hd{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:130px;height:130px;border-radius:50%;--p:0deg;background:conic-gradient(#cfe8ff var(--p),rgba(255,255,255,.14) 0);display:grid;place-items:center;touch-action:none;cursor:pointer}
.hd::before{content:"";position:absolute;inset:9px;border-radius:50%;background:rgba(8,14,30,.88)}
.hd span{position:relative;font-size:.95rem;letter-spacing:.1em;text-transform:uppercase}
.hd.on{box-shadow:0 0 36px #cfe8ff}
.pa{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 1.2s}
.pa.on{opacity:1}
.pan{font-size:6rem;filter:drop-shadow(0 0 22px #cfe8ff) brightness(1.7) saturate(.2);animation:fly 3s ease-in-out infinite}
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:40;background:rgba(10,8,24,.85);border:1px solid var(--acc);color:var(--acc);padding:8px 16px;border-radius:20px;font-weight:700;animation:tt 2.2s forwards;pointer-events:none}
@keyframes tt{0%{opacity:0;transform:translate(-50%,10px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
.sh{animation:shk .4s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#s_lake{background:linear-gradient(#4a3f8c,#d9707a 42%,#ffc489 58%)}
#s_dorm{background:linear-gradient(#05050f,#120c1e)}
input{font-family:var(--serif);font-size:1.1rem;padding:8px 12px;border:2px solid #8a6a2f;background:#1b1530;color:var(--ink);border-radius:6px;width:100%;box-sizing:border-box;text-align:center;user-select:text;-webkit-user-select:text}
input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.palm{position:absolute;font-size:7rem;filter:brightness(.15);line-height:1}
.fl2{position:absolute;font-size:1.4rem;animation:flt 9s ease-in-out infinite alternate}
@keyframes flt{to{transform:translate(40px,-8px) rotate(30deg)}}
.pmt{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:rgba(10,8,24,.6);border:1px solid #6e5a2a;border-radius:20px;padding:4px 12px;font-size:.9rem;white-space:nowrap;z-index:2}
.pet{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);touch-action:none;animation:pb 2.4s ease-in-out infinite;cursor:grab}
.pet.zzz{animation:none}
@keyframes pb{50%{transform:translate(-50%,-54%)}}
.pe{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pet.zzz .pe{animation:none;transform:scaleY(.12)}
.lei{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-size:1.5rem;opacity:0;transition:opacity 1s;white-space:nowrap}
.zzm{position:absolute;right:-6px;top:-10px;font-size:2rem;opacity:0;transition:opacity 1s;animation:fly 3s ease-in-out infinite}
.ball{position:absolute;font-size:2rem;background:none;border:0;padding:6px;box-shadow:none;text-transform:none;transition:left .6s ease-in-out,top .6s ease-in-out;display:none;z-index:2}
.pfeed{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:2}
.nm{position:absolute;left:7%;right:7%;top:18%;background:rgba(14,10,28,.92);border:1px solid var(--acc);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;z-index:5}
.stampx{border:4px solid #c8323a;color:#e0525a;font-size:1.8rem;font-weight:700;letter-spacing:.1em;padding:4px 14px;text-transform:uppercase;animation:slam .6s both}
@keyframes slam{from{opacity:0;transform:rotate(-8deg) scale(2.6)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
.cdls{position:absolute;left:0;right:0;top:12%;display:flex;justify-content:space-around;padding:0 6px}
.cdl{background:none;border:0;box-shadow:none;font-size:2.4rem;padding:6px;filter:drop-shadow(0 0 12px #ffb04a);transition:filter 1s}
.cdl.off{filter:grayscale(1) brightness(.45)}
.brw{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:170px;height:170px;transition:opacity 1s}
.brc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),var(--acc));box-shadow:0 0 40px var(--acc);opacity:.85}
.brt{position:absolute;left:0;right:0;top:100%;margin-top:14px;text-align:center;font-weight:700;letter-spacing:.06em}
.hold{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:210px;height:64px;border-radius:32px;touch-action:none}
.hold.on{filter:brightness(1.4);box-shadow:0 0 30px var(--acc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body>
<div id="bg"></div><div class="vig"></div>
<div id="hud"><span>✨ <b id="pts">0</b></span><span id="stg"></span><button id="mute" class="ghost" onclick="toggleMute()" aria-label="Звук" style="display:none;box-shadow:none;padding:5px 10px">🔊</button></div>
<main id="app"></main>
<script>
/* ===== МЕНЯЙ ЗДЕСЬ ===== */
const NAME="Мээрим", SENDER="Набиль", TG="NabilSarzanov";
const NOTE="Ты сдала курсовую, прошла весь этот день в замке, и сегодня можно ни о чём не беспокоиться. Ты заслуживаешь таких вечеров почаще. Пусть этот огонь тебя согреет.";
/* ======================= */
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),vibe=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function many(el,n,cls,fn){for(let i=0;i<n;i++){const d=document.createElement("div");d.className=cls;fn(d,i);el.appendChild(d)}}
function books(x,y,w,rows,rh,seed){let s="",r=seed;const R=()=>(r=(r*9301+49297)%233280)/233280,cols=["#6b2d2d","#2d4a6b","#3d6b3a","#6b5a2d","#4a2d6b","#8a4a2a","#2d6b62"];
 for(let j=0;j<rows;j++){let cx=x;const yy=y+j*rh;s+=`<rect x="${x}" y="${yy+rh-4}" width="${w}" height="4" fill="#120a05"/>`;
  while(cx<x+w-6){const bw=6+R()*9,bh=rh*(.6+R()*.33);s+=`<rect x="${cx}" y="${yy+rh-4-bh}" width="${bw}" height="${bh}" fill="${cols[Math.floor(R()*cols.length)]}"/>`;cx+=bw+1}}
 return s}
const VB='viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true"';
const S={};
S.night=()=>`<div class="st"></div><div class="st b"></div><svg ${VB}><defs><filter id="nb"><feGaussianBlur stdDeviation="9"/></filter><filter id="nb2"><feGaussianBlur stdDeviation="2.5"/></filter><linearGradient id="nl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a48"/><stop offset="1" stop-color="#05061a"/></linearGradient>
<g id="cas"><path fill="#05060f" d="M30 652L78 592L130 586L170 548H252L296 586L350 594L376 652Z"/><g fill="#05060f"><rect x="148" y="455" width="30" height="100"/><path d="M144 455L163 395L182 455Z"/><rect x="188" y="492" width="64" height="62"/><path d="M184 492L220 456L256 492Z"/><rect x="262" y="430" width="26" height="125"/><path d="M258 430L275 365L292 430Z"/><rect x="108" y="522" width="36" height="40"/><path d="M104 522L126 490L148 522Z"/><rect x="302" y="506" width="30" height="50"/><path d="M298 506L317 470L336 506Z"/></g><g fill="#ffcf6a"><rect class="wn" x="158" y="480" width="6" height="11"/><rect class="wn" x="200" y="515" width="6" height="10" style="animation-delay:-1s"/><rect class="wn" x="224" y="515" width="6" height="10" style="animation-delay:-2.2s"/><rect class="wn" x="272" y="460" width="6" height="11" style="animation-delay:-.6s"/><rect class="wn" x="118" y="535" width="6" height="9" style="animation-delay:-3s"/><rect class="wn" x="312" y="525" width="6" height="9" style="animation-delay:-1.7s"/></g></g></defs>
<circle cx="285" cy="165" r="74" fill="#c9d4f2" opacity=".2" filter="url(#nb)"/><circle cx="285" cy="165" r="34" fill="#f6f3e4"/><circle cx="276" cy="158" r="6" fill="#d8d6c8" opacity=".6"/>
<rect y="652" width="400" height="148" fill="url(#nl)"/><use href="#cas"/><g opacity=".22" filter="url(#nb2)"><use href="#cas" transform="translate(0 1304) scale(1 -1)"/></g></svg><div class="owlfly">🦉</div><div class="mist"></div>`;
S.hall=()=>`<div class="st" style="height:42%"></div><svg ${VB}><defs><linearGradient id="hp" x1="0" x2="1"><stop offset="0" stop-color="#0c0a10"/><stop offset=".5" stop-color="#2a1d14"/><stop offset="1" stop-color="#0c0a10"/></linearGradient></defs>
<rect y="330" width="400" height="470" fill="#120d16"/>${[40,160,280].map(x=>`<path d="M${x} 560V430Q${x} 365 ${x+40} 365Q${x+80} 365 ${x+80} 430V560Z" fill="#33477f" opacity=".5"/><path d="M${x+40} 365V560M${x} 460H${x+80}" stroke="#120d16" stroke-width="3"/>`).join("")}
<rect y="560" width="400" height="240" fill="#1b1210"/><polygon points="40,800 130,800 188,585 172,585" fill="#2e1d11"/><polygon points="270,800 360,800 228,585 212,585" fill="#2e1d11"/>
<rect x="-20" width="60" height="800" fill="url(#hp)"/><rect x="360" width="60" height="800" fill="url(#hp)"/>
${[["#b3262b",70],["#2f5fb8",120],["#d9a521",262],["#2d8a4e",312]].map(b=>`<path d="M${b[1]} 340h26v110l-13-16-13 16z" fill="${b[0]}" opacity=".8"/>`).join("")}</svg>`;
S.class=()=>`<svg ${VB}><path d="M120 380V215Q120 125 200 125Q280 125 280 215V380Z" fill="#0d1534"/><g stroke="#3a2614" stroke-width="5" fill="none"><path d="M120 380V215Q120 125 200 125Q280 125 280 215V380Z"/><path d="M200 125V380M120 255H280"/></g><circle cx="236" cy="190" r="14" fill="#f2efe0"/>
